<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,sans-serif;">
  <rect width="800" height="560" fill="#fff"/>

  <text x="40" y="34" font-size="17" font-weight="600" fill="#1e293b">AA Intelligence Index: US open vs Chinese open vs closed</text>
  <text x="40" y="54" font-size="12" fill="#64748b">As of June 2026. Source: Artificial Analysis.</text>

  <!--
    bar area: x=230..740, scale=8px per point, range 0..65
    bar heights: 38px, gap between: 16px → per-bar space: 54px
    y starts at 78
  -->
  <line x1="230" y1="70" x2="230" y2="498" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="310" y1="70" x2="310" y2="498" stroke="#f1f5f9" stroke-width="1"/>
  <line x1="390" y1="70" x2="390" y2="498" stroke="#f1f5f9" stroke-width="1"/>
  <line x1="470" y1="70" x2="470" y2="498" stroke="#f1f5f9" stroke-width="1"/>
  <line x1="550" y1="70" x2="550" y2="498" stroke="#f1f5f9" stroke-width="1"/>
  <line x1="630" y1="70" x2="630" y2="498" stroke="#f1f5f9" stroke-width="1"/>
  <line x1="710" y1="70" x2="710" y2="498" stroke="#f1f5f9" stroke-width="1"/>
  <line x1="230" y1="498" x2="740" y2="498" stroke="#cbd5e1" stroke-width="1"/>

  <!-- Row 1: Claude Opus 4.8 — 61 → width=488 — CLOSED -->
  <text x="222" y="107" font-size="12.5" fill="#1e293b" text-anchor="end">Claude Opus 4.8</text>
  <rect x="230" y="78" width="488" height="38" fill="#0f172a" rx="3"/>
  <text x="724" y="102" font-size="12" font-weight="700" fill="#0f172a">61</text>

  <!-- Row 2: GPT-5.5 — 60 → width=480 — CLOSED -->
  <text x="222" y="161" font-size="12.5" fill="#1e293b" text-anchor="end">GPT-5.5</text>
  <rect x="230" y="132" width="480" height="38" fill="#0f172a" rx="3" opacity="0.8"/>
  <text x="716" y="156" font-size="12" font-weight="700" fill="#374151">60</text>

  <!-- Row 3: Kimi K2.6 — 54 → width=432 — CN OPEN -->
  <text x="222" y="215" font-size="12.5" fill="#1e293b" text-anchor="end">Kimi K2.6</text>
  <rect x="230" y="186" width="432" height="38" fill="#dc2626" rx="3"/>
  <text x="668" y="210" font-size="12" font-weight="700" fill="#dc2626">54</text>

  <!-- Row 4: MiMo-V2.5-Pro — 54 → width=432 — CN OPEN -->
  <text x="222" y="269" font-size="12.5" fill="#1e293b" text-anchor="end">Xiaomi MiMo-V2.5-Pro</text>
  <rect x="230" y="240" width="432" height="38" fill="#dc2626" rx="3" opacity="0.85"/>
  <text x="668" y="264" font-size="12" font-weight="700" fill="#b91c1c">54</text>

  <!-- Row 5: DeepSeek V4 Pro — 52 → width=416 — CN OPEN -->
  <text x="222" y="323" font-size="12.5" fill="#1e293b" text-anchor="end">DeepSeek V4 Pro</text>
  <rect x="230" y="294" width="416" height="38" fill="#dc2626" rx="3" opacity="0.7"/>
  <text x="652" y="318" font-size="12" font-weight="700" fill="#b91c1c">52</text>

  <!-- Row 6: GLM-5 — 51 → width=408 — CN OPEN -->
  <text x="222" y="377" font-size="12.5" fill="#1e293b" text-anchor="end">GLM-5 (Zhipu)</text>
  <rect x="230" y="348" width="408" height="38" fill="#dc2626" rx="3" opacity="0.55"/>
  <text x="644" y="372" font-size="12" font-weight="700" fill="#9b1c1c">51</text>

  <!-- Row 7: Nemotron 3 Ultra — 48 → width=384 — US OPEN -->
  <text x="222" y="431" font-size="12.5" fill="#1e293b" text-anchor="end">Nvidia Nemotron 3 Ultra</text>
  <rect x="230" y="402" width="384" height="38" fill="#2563eb" rx="3"/>
  <text x="620" y="426" font-size="12" font-weight="700" fill="#2563eb">48</text>

  <!-- Row 8: gpt-oss 120b — 33 → width=264 — US OPEN -->
  <text x="222" y="485" font-size="12.5" fill="#1e293b" text-anchor="end">OpenAI gpt-oss 120b</text>
  <rect x="230" y="456" width="264" height="38" fill="#2563eb" rx="3" opacity="0.7"/>
  <text x="500" y="480" font-size="12" font-weight="700" fill="#1d4ed8">33</text>

  <!-- X axis labels: 0 10 20 30 40 50 60 -->
  <text x="230" y="515" font-size="11" fill="#94a3b8" text-anchor="middle">0</text>
  <text x="310" y="515" font-size="11" fill="#94a3b8" text-anchor="middle">10</text>
  <text x="390" y="515" font-size="11" fill="#94a3b8" text-anchor="middle">20</text>
  <text x="470" y="515" font-size="11" fill="#94a3b8" text-anchor="middle">30</text>
  <text x="550" y="515" font-size="11" fill="#94a3b8" text-anchor="middle">40</text>
  <text x="630" y="515" font-size="11" fill="#94a3b8" text-anchor="middle">50</text>
  <text x="710" y="515" font-size="11" fill="#94a3b8" text-anchor="middle">60</text>
  <text x="480" y="530" font-size="11" fill="#94a3b8" text-anchor="middle">AA Intelligence Index</text>

  <!-- Legend -->
  <rect x="230" y="545" width="12" height="12" fill="#0f172a" rx="2"/>
  <text x="248" y="556" font-size="12" fill="#64748b">Closed</text>
  <rect x="320" y="545" width="12" height="12" fill="#dc2626" rx="2"/>
  <text x="338" y="556" font-size="12" fill="#64748b">Chinese open</text>
  <rect x="440" y="545" width="12" height="12" fill="#2563eb" rx="2"/>
  <text x="458" y="556" font-size="12" fill="#64748b">US open</text>
</svg>
