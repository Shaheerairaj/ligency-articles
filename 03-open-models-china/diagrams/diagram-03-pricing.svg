<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,sans-serif;">
  <rect width="800" height="420" fill="#fff"/>

  <text x="40" y="34" font-size="17" font-weight="600" fill="#1e293b">API cost per million output tokens</text>
  <text x="40" y="54" font-size="12" fill="#64748b">Log scale. Open-weight models via hosted API vs closed frontier models.</text>

  <!--
    Log scale: $0.10 to $40
    log10(0.1)=-1, log10(40)=1.602, range=2.602
    bar area x=220..740 (520px), px_per_log_unit=200
    x(p) = 220 + (log10(p)+1)/2.602*520
    V4-Flash $0.28: x=309 (width=89)
    V4 Pro $3.48:   x=528 (width=308)
    Claude $25:     x=699 (width=479)
    GPT-5.5 $30:    x=715 (width=495)
  -->

  <!-- Grid lines at $0.10, $0.50, $1, $5, $10, $40 -->
  <line x1="220" y1="72" x2="220" y2="310" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="360" y1="72" x2="360" y2="310" stroke="#f1f5f9" stroke-width="1"/>
  <line x1="420" y1="72" x2="420" y2="310" stroke="#f1f5f9" stroke-width="1"/>
  <line x1="560" y1="72" x2="560" y2="310" stroke="#f1f5f9" stroke-width="1"/>
  <line x1="620" y1="72" x2="620" y2="310" stroke="#f1f5f9" stroke-width="1"/>
  <line x1="740" y1="72" x2="740" y2="310" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="220" y1="310" x2="740" y2="310" stroke="#cbd5e1" stroke-width="1"/>

  <!-- Bar 1: DeepSeek V4-Flash $0.28 → width=89 -->
  <text x="212" y="103" font-size="13" fill="#1e293b" text-anchor="end">DeepSeek V4-Flash</text>
  <rect x="220" y="80" width="89" height="38" fill="#dc2626" rx="3"/>
  <text x="316" y="104" font-size="13" font-weight="700" fill="#dc2626">$0.28</text>

  <!-- Bar 2: DeepSeek V4 Pro $3.48 → width=308 -->
  <text x="212" y="162" font-size="13" fill="#1e293b" text-anchor="end">DeepSeek V4 Pro</text>
  <rect x="220" y="139" width="308" height="38" fill="#dc2626" rx="3" opacity="0.7"/>
  <text x="535" y="163" font-size="13" font-weight="700" fill="#b91c1c">$3.48</text>

  <!-- Bar 3: Claude Opus 4.8 $25 → width=479 -->
  <text x="212" y="221" font-size="13" fill="#1e293b" text-anchor="end">Claude Opus 4.8</text>
  <rect x="220" y="198" width="479" height="38" fill="#0f172a" rx="3"/>
  <text x="706" y="222" font-size="13" font-weight="700" fill="#0f172a">$25</text>

  <!-- Bar 4: GPT-5.5 $30 → width=495 -->
  <text x="212" y="280" font-size="13" fill="#1e293b" text-anchor="end">GPT-5.5</text>
  <rect x="220" y="257" width="495" height="38" fill="#0f172a" rx="3" opacity="0.75"/>
  <text x="722" y="281" font-size="13" font-weight="700" fill="#374151">$30</text>

  <!-- X axis labels -->
  <text x="220" y="328" font-size="11" fill="#94a3b8" text-anchor="middle">$0.10</text>
  <text x="360" y="328" font-size="11" fill="#94a3b8" text-anchor="middle">$0.50</text>
  <text x="420" y="328" font-size="11" fill="#94a3b8" text-anchor="middle">$1</text>
  <text x="560" y="328" font-size="11" fill="#94a3b8" text-anchor="middle">$5</text>
  <text x="620" y="328" font-size="11" fill="#94a3b8" text-anchor="middle">$10</text>
  <text x="740" y="328" font-size="11" fill="#94a3b8" text-anchor="middle">$40</text>
  <text x="480" y="348" font-size="11" fill="#94a3b8" text-anchor="middle">← log scale →</text>

  <!-- Callout: 8.6x cheaper -->
  <line x1="309" y1="100" x2="309" y2="60" stroke="#64748b" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="528" y1="120" x2="528" y2="60" stroke="#64748b" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="309" y1="60" x2="528" y2="60" stroke="#64748b" stroke-width="1"/>
  <text x="418" y="55" font-size="11" fill="#64748b" text-anchor="middle">12× cheaper</text>

  <!-- Legend -->
  <rect x="220" y="368" width="12" height="12" fill="#dc2626" rx="2"/>
  <text x="238" y="379" font-size="12" fill="#64748b">Chinese open model (API)</text>
  <rect x="430" y="368" width="12" height="12" fill="#0f172a" rx="2"/>
  <text x="448" y="379" font-size="12" fill="#64748b">Closed model (API)</text>

  <text x="40" y="412" font-size="10" fill="#94a3b8">Prices per million output tokens as of June 2026. Self-hosted open models incur GPU costs instead.</text>
</svg>
