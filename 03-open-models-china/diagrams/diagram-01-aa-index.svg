<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,sans-serif;">
  <rect width="800" height="520" fill="#fff"/>

  <text x="40" y="34" font-size="17" font-weight="600" fill="#1e293b">AA Intelligence Index: best open vs best closed model, 2025–2026</text>
  <text x="40" y="54" font-size="12" fill="#64748b">The gap has held at roughly 6–7 points throughout. Both sides improved; neither closed in on the other.</text>

  <!--
    Chart area: x=100..740 (640px), y=80..400 (320px)
    Y range: 30..70 (40 pts). px_per_pt = 320/40 = 8
    y(v) = 400 - (v-30)*8
    v=30 → 400, v=40 → 320, v=50 → 240, v=60 → 160, v=70 → 80

    X axis: 5 points, spacing=160
    Jun25=100, Sep25=260, Dec25=420, Apr26=580, Jun26=740

    Data:
      Jun25: closed≈47(y=264), open≈41(y=312)
      Sep25: closed≈50(y=240), open≈44(y=288)
      Dec25: closed≈53(y=216), open≈47(y=264)
      Apr26: closed=57(y=184), open=54(y=208)  [VERIFIED]
      Jun26: closed=61(y=152), open=54(y=208)  [VERIFIED]
  -->

  <!-- Y axis grid lines -->
  <line x1="100" y1="400" x2="740" y2="400" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="100" y1="320" x2="740" y2="320" stroke="#f1f5f9" stroke-width="1"/>
  <line x1="100" y1="240" x2="740" y2="240" stroke="#f1f5f9" stroke-width="1"/>
  <line x1="100" y1="160" x2="740" y2="160" stroke="#f1f5f9" stroke-width="1"/>
  <line x1="100" y1="80"  x2="740" y2="80"  stroke="#f1f5f9" stroke-width="1"/>

  <!-- Y axis labels -->
  <text x="92" y="404" font-size="11" fill="#94a3b8" text-anchor="end">30</text>
  <text x="92" y="324" font-size="11" fill="#94a3b8" text-anchor="end">40</text>
  <text x="92" y="244" font-size="11" fill="#94a3b8" text-anchor="end">50</text>
  <text x="92" y="164" font-size="11" fill="#94a3b8" text-anchor="end">60</text>
  <text x="92" y="84"  font-size="11" fill="#94a3b8" text-anchor="end">70</text>
  <text transform="rotate(-90,28,240)" x="28" y="240" font-size="11" fill="#94a3b8" text-anchor="middle">AA Intelligence Index</text>

  <!-- Shaded gap between the two lines -->
  <polygon points="100,264 260,240 420,216 580,184 740,152 740,208 580,208 420,264 260,288 100,312"
           fill="#fecaca" opacity="0.35"/>

  <!-- Closed model line — dashed for estimates, solid for verified segment -->
  <polyline points="100,264 260,240 420,216 580,184" fill="none" stroke="#0f172a" stroke-width="2.5" stroke-dasharray="7,4" opacity="0.6"/>
  <polyline points="580,184 740,152" fill="none" stroke="#0f172a" stroke-width="2.5"/>

  <!-- Open model line -->
  <polyline points="100,312 260,288 420,264 580,208" fill="none" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="7,4" opacity="0.6"/>
  <polyline points="580,208 740,208" fill="none" stroke="#dc2626" stroke-width="2.5"/>

  <!-- Estimated points (open circles) -->
  <circle cx="100" cy="264" r="5" fill="#fff" stroke="#0f172a" stroke-width="2"/>
  <circle cx="260" cy="240" r="5" fill="#fff" stroke="#0f172a" stroke-width="2"/>
  <circle cx="420" cy="216" r="5" fill="#fff" stroke="#0f172a" stroke-width="2"/>
  <circle cx="100" cy="312" r="5" fill="#fff" stroke="#dc2626" stroke-width="2"/>
  <circle cx="260" cy="288" r="5" fill="#fff" stroke="#dc2626" stroke-width="2"/>
  <circle cx="420" cy="264" r="5" fill="#fff" stroke="#dc2626" stroke-width="2"/>

  <!-- Verified points (filled circles) — Apr 2026 -->
  <circle cx="580" cy="184" r="6" fill="#0f172a" stroke="#fff" stroke-width="2"/>
  <circle cx="580" cy="208" r="6" fill="#dc2626" stroke="#fff" stroke-width="2"/>
  <!-- Verified points — Jun 2026 -->
  <circle cx="740" cy="152" r="6" fill="#0f172a" stroke="#fff" stroke-width="2"/>
  <circle cx="740" cy="208" r="6" fill="#dc2626" stroke="#fff" stroke-width="2"/>

  <!-- Value labels for verified points -->
  <text x="568" y="178" font-size="11" font-weight="600" fill="#0f172a" text-anchor="end">57</text>
  <text x="568" y="215" font-size="11" font-weight="600" fill="#dc2626" text-anchor="end">54</text>
  <text x="748" y="146" font-size="11" font-weight="600" fill="#0f172a">61</text>
  <text x="748" y="220" font-size="11" font-weight="600" fill="#dc2626">54</text>

  <!-- Gap bracket at Jun 2026 -->
  <line x1="762" y1="152" x2="762" y2="208" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="757" y1="152" x2="767" y2="152" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="757" y1="208" x2="767" y2="208" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="770" y="184" font-size="11" fill="#64748b">7 pts</text>

  <!-- X axis labels -->
  <line x1="100" y1="400" x2="100" y2="408" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="260" y1="400" x2="260" y2="408" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="420" y1="400" x2="420" y2="408" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="580" y1="400" x2="580" y2="408" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="740" y1="400" x2="740" y2="408" stroke="#cbd5e1" stroke-width="1"/>
  <text x="100" y="424" font-size="11" fill="#94a3b8" text-anchor="middle">Jun 2025</text>
  <text x="260" y="424" font-size="11" fill="#94a3b8" text-anchor="middle">Sep 2025</text>
  <text x="420" y="424" font-size="11" fill="#94a3b8" text-anchor="middle">Dec 2025</text>
  <text x="580" y="424" font-size="11" fill="#94a3b8" text-anchor="middle">Apr 2026</text>
  <text x="740" y="424" font-size="11" fill="#94a3b8" text-anchor="middle">Jun 2026</text>

  <!-- Legend -->
  <line x1="100" y1="453" x2="132" y2="453" stroke="#0f172a" stroke-width="2.5"/>
  <circle cx="116" cy="453" r="4" fill="#0f172a"/>
  <text x="138" y="457" font-size="12" fill="#1e293b">Best closed model (Claude Opus / GPT-5.5)</text>

  <line x1="100" y1="472" x2="132" y2="472" stroke="#dc2626" stroke-width="2.5"/>
  <circle cx="116" cy="472" r="4" fill="#dc2626"/>
  <text x="138" y="476" font-size="12" fill="#1e293b">Best open-weight model (Kimi K2.6 / MiMo)</text>

  <line x1="420" y1="453" x2="452" y2="453" stroke="#64748b" stroke-width="2" stroke-dasharray="7,4"/>
  <text x="458" y="457" font-size="12" fill="#64748b">Estimated trend</text>
  <circle cx="490" cy="472" r="4" fill="#0f172a"/>
  <text x="498" y="476" font-size="12" fill="#64748b">Verified data point</text>

  <text x="40" y="506" font-size="10" fill="#94a3b8">Source: Artificial Analysis Intelligence Index (Apr and Jun 2026 data verified). Earlier trend estimated from reported ~6-month lag.</text>
</svg>
