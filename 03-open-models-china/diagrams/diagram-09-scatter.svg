<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,sans-serif;">
  <rect width="800" height="520" fill="#fff"/>

  <text x="40" y="34" font-size="17" font-weight="600" fill="#1e293b">Price vs capability: open and closed models</text>
  <text x="40" y="54" font-size="12" fill="#64748b">X axis: API cost per million output tokens (log scale). Y axis: AA Intelligence Index. Self-hosted models shown at far left.</text>

  <!--
    Chart area: x=100..740 (640px), y=80..400 (320px)
    Y: AA score 25..70, range=45, px/pt = 320/45 = 7.11
    y(v) = 400 - (v-25)*7.11

    X: log scale from $0.05 to $40
    log10(0.05)=-1.301, log10(40)=1.602, range=2.903
    px_per_log = 640/2.903 = 220.5
    x(p) = 100 + (log10(p)+1.301)/2.903*640

    Self-hosted cluster: we show at ~$0.07 nominal
    x(0.07) = 100 + (-1.155+1.301)/2.903*640 = 100 + 0.146/2.903*640 = 100 + 32 = 132

    V4-Flash $0.28:
      x = 100 + (-0.553+1.301)/2.903*640 = 100 + 0.748/2.903*640 = 100 + 165 = 265
    V4 Pro $3.48:
      x = 100 + (0.541+1.301)/2.903*640 = 100 + 1.842/2.903*640 = 100 + 405 = 505
    Claude $25:
      x = 100 + (1.398+1.301)/2.903*640 = 100 + 2.699/2.903*640 = 100 + 595 = 695
    GPT-5.5 $30:
      x = 100 + (1.477+1.301)/2.903*640 = 100 + 2.778/2.903*640 = 100 + 612 = 712

    Y values:
      AA 33 (gpt-oss): y = 400-(33-25)*7.11 = 400-56.9 = 343
      AA 48 (Nemotron): y = 400-(48-25)*7.11 = 400-163.5 = 237
      AA 51 (GLM-5):    y = 400-(51-25)*7.11 = 400-184.9 = 215
      AA 52 (V4 Pro):   y = 400-(52-25)*7.11 = 400-192.0 = 208
      AA 54 (Kimi/MiMo): y = 400-(54-25)*7.11 = 400-206.2 = 194
      AA 60 (GPT-5.5):  y = 400-(60-25)*7.11 = 400-248.9 = 151
      AA 61 (Claude):   y = 400-(61-25)*7.11 = 400-256.0 = 144
  -->

  <!-- Y axis grid lines -->
  <line x1="100" y1="400" x2="740" y2="400" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="100" y1="329" x2="740" y2="329" stroke="#f1f5f9" stroke-width="1"/><!-- 35 -->
  <line x1="100" y1="258" x2="740" y2="258" stroke="#f1f5f9" stroke-width="1"/><!-- 45 -->
  <line x1="100" y1="187" x2="740" y2="187" stroke="#f1f5f9" stroke-width="1"/><!-- 55 -->
  <line x1="100" y1="115" x2="740" y2="115" stroke="#f1f5f9" stroke-width="1"/><!-- 65 -->

  <!-- Y axis labels -->
  <text x="92" y="404" font-size="11" fill="#94a3b8" text-anchor="end">25</text>
  <text x="92" y="333" font-size="11" fill="#94a3b8" text-anchor="end">35</text>
  <text x="92" y="262" font-size="11" fill="#94a3b8" text-anchor="end">45</text>
  <text x="92" y="191" font-size="11" fill="#94a3b8" text-anchor="end">55</text>
  <text x="92" y="119" font-size="11" fill="#94a3b8" text-anchor="end">65</text>
  <text transform="rotate(-90,28,240)" x="28" y="240" font-size="11" fill="#94a3b8" text-anchor="middle">AA Intelligence Index</text>

  <!-- X axis vertical grid lines at tick positions -->
  <line x1="100" y1="80"  x2="100" y2="400" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="198" y1="80"  x2="198" y2="400" stroke="#f1f5f9" stroke-width="1"/><!-- $0.10 -->
  <line x1="320" y1="80"  x2="320" y2="400" stroke="#f1f5f9" stroke-width="1"/><!-- $0.50 -->
  <line x1="382" y1="80"  x2="382" y2="400" stroke="#f1f5f9" stroke-width="1"/><!-- $1 -->
  <line x1="504" y1="80"  x2="504" y2="400" stroke="#f1f5f9" stroke-width="1"/><!-- $5 -->
  <line x1="566" y1="80"  x2="566" y2="400" stroke="#f1f5f9" stroke-width="1"/><!-- $10 -->
  <line x1="740" y1="80"  x2="740" y2="400" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Dashed divider between self-hosted and API zone -->
  <line x1="178" y1="80" x2="178" y2="400" stroke="#e2e8f0" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="100" y="420" font-size="10" fill="#94a3b8" text-anchor="middle">self-</text>
  <text x="100" y="430" font-size="10" fill="#94a3b8" text-anchor="middle">hosted</text>
  <text x="178" y="420" font-size="10" fill="#94a3b8" text-anchor="middle">↑</text>

  <!-- X axis labels -->
  <text x="198" y="420" font-size="10" fill="#94a3b8" text-anchor="middle">$0.10</text>
  <text x="320" y="420" font-size="10" fill="#94a3b8" text-anchor="middle">$0.50</text>
  <text x="382" y="420" font-size="10" fill="#94a3b8" text-anchor="middle">$1</text>
  <text x="504" y="420" font-size="10" fill="#94a3b8" text-anchor="middle">$5</text>
  <text x="566" y="420" font-size="10" fill="#94a3b8" text-anchor="middle">$10</text>
  <text x="740" y="420" font-size="10" fill="#94a3b8" text-anchor="middle">$40</text>
  <text x="460" y="436" font-size="11" fill="#94a3b8" text-anchor="middle">Cost per million output tokens (log scale) →</text>

  <!-- SELF-HOSTED cluster (x≈132) -->
  <!-- gpt-oss: x=132, y=343 -->
  <circle cx="132" cy="343" r="8" fill="#2563eb" opacity="0.85"/>
  <text x="143" y="340" font-size="11" fill="#1d4ed8">gpt-oss (33)</text>

  <!-- Nemotron: x=132, y=237 — offset slightly -->
  <circle cx="118" cy="237" r="8" fill="#2563eb" opacity="0.85"/>
  <text x="130" y="234" font-size="11" fill="#1d4ed8">Nemotron (48)</text>

  <!-- GLM-5: x=132, y=215 — offset -->
  <circle cx="148" cy="215" r="8" fill="#dc2626" opacity="0.85"/>
  <text x="90"  y="215" font-size="11" fill="#9b1c1c" text-anchor="end">GLM-5 (51)</text>

  <!-- Kimi: x=132, y=194 -->
  <circle cx="126" cy="194" r="8" fill="#dc2626" opacity="0.85"/>
  <text x="90" y="196" font-size="11" fill="#9b1c1c" text-anchor="end">Kimi (54)</text>

  <!-- MiMo: offset to avoid overlap -->
  <circle cx="150" cy="188" r="8" fill="#dc2626" opacity="0.85"/>
  <text x="162" y="183" font-size="11" fill="#9b1c1c">MiMo (54)</text>

  <!-- API-priced: V4-Flash $0.28, x=265, y=208 -->
  <circle cx="265" cy="208" r="8" fill="#dc2626"/>
  <text x="275" y="203" font-size="11" font-weight="600" fill="#dc2626">V4-Flash $0.28</text>
  <text x="275" y="217" font-size="10" fill="#9b1c1c">score: 52</text>

  <!-- V4 Pro $3.48, x=505, y=208 -->
  <circle cx="505" cy="208" r="8" fill="#dc2626"/>
  <text x="515" y="203" font-size="11" font-weight="600" fill="#dc2626">V4 Pro $3.48</text>
  <text x="515" y="217" font-size="10" fill="#9b1c1c">score: 52</text>

  <!-- Claude Opus 4.8 $25, x=695, y=144 -->
  <circle cx="695" cy="144" r="8" fill="#0f172a"/>
  <text x="680" y="133" font-size="11" font-weight="600" fill="#0f172a" text-anchor="end">Claude Opus 4.8</text>
  <text x="680" y="145" font-size="10" fill="#374151" text-anchor="end">$25 · score: 61</text>

  <!-- GPT-5.5 $30, x=712, y=151 -->
  <circle cx="712" cy="151" r="8" fill="#374151"/>
  <text x="724" y="148" font-size="11" font-weight="600" fill="#374151">GPT-5.5</text>
  <text x="724" y="160" font-size="10" fill="#64748b">$30 · score: 60</text>

  <!-- Annotation: "8–10× cheaper for similar capability" -->
  <line x1="265" y1="208" x2="505" y2="208" stroke="#64748b" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="385" y="226" font-size="10" fill="#64748b" text-anchor="middle">12× cheaper</text>
  <text x="385" y="237" font-size="10" fill="#64748b" text-anchor="middle">same score</text>

  <!-- Legend -->
  <circle cx="100" cy="462" r="6" fill="#dc2626"/>
  <text x="112" y="466" font-size="12" fill="#64748b">Chinese open model</text>
  <circle cx="270" cy="462" r="6" fill="#2563eb"/>
  <text x="282" y="466" font-size="12" fill="#64748b">US open model</text>
  <circle cx="410" cy="462" r="6" fill="#0f172a"/>
  <text x="422" y="466" font-size="12" fill="#64748b">Closed model</text>

  <text x="40" y="498" font-size="10" fill="#94a3b8">Self-hosted models incur GPU/VRAM costs rather than per-token API fees — placed at left for illustration. Source: Artificial Analysis, June 2026.</text>
</svg>
